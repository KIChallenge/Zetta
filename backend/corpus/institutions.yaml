# Institutions and their contact channels. Only facts stated in the source pages.
# Phone `hours`: structured windows, or `not_stated` when the source gives no call times.
# A channel's own `source_url` is set where its data comes from another page than the institution's.

- id: pva_vienna
  name: Pensionsversicherung (PV), Landesstelle Wien
  kind: insurer
  address: Friedrich-Hillegeist-Straße 1, 1020 Wien
  channels:
    - id: phone
      type: phone
      value: +43 (0)5 03 03
      label: Telefonischer Kundenservice
      hours:
        - {days: [mon, tue, wed], from: "07:00", to: "15:30"}
        - {days: [thu], from: "07:00", to: "18:00"}
        - {days: [fri], from: "07:00", to: "15:00"}
      source_url: https://www.pv.at/cdscontent/load?contentid=10008.776966&version=1740571496
    - id: appointments
      type: phone
      value: +43 (0)5 03 03-27 170
      label: Terminvereinbarung für eine persönliche Beratung
      hours: not_stated
    - id: email
      type: email
      value: pva-lsw@pv.at
    - id: customer_centre
      type: visit
      value: Ghegastraße 1, 1030 Wien
      label: Zentrum für Kund*innen (Beratung nach Terminvereinbarung)
      hours:
        - {days: [mon, tue, wed], from: "07:00", to: "15:00"}
        - {days: [thu], from: "07:00", to: "18:00"}
        - {days: [fri], from: "07:00", to: "15:00"}
  source_url: https://www.pv.at/web/service-und-kontakt/kontakt/wien/kontakt-wien
  verified_at: 2026-11-05

