- id: parent_child_pass
  title: Eltern-Kind-Pass-Untersuchungen
  summary: Ärztliche Untersuchungen des Kindes bis zum 5. Lebensjahr, im ersten Lebensjahr besonders oft.
  priority: 13
  triggers:
    - {goal: [child_offers], subject: [child], subject_age_band: ["0-5"]}
  requires: [subject_age_band]
  responsible:
    - {institution: oegk_health_check}
  checked_by:
    - Seit Oktober gibt es ein neues Untersuchungsprogramm; welche Untersuchung gerade fällig ist, steht im Eltern-Kind-Pass.
  source_url: https://www.oesterreich.gv.at/de/themen/familie_und_partnerschaft/eltern-kind-pass/Seite.082211
  verified_at: 2026-11-05
  steps:
    - id: info
      type: info
      title: Welche Untersuchung ist fällig?
      why: Die Untersuchungen sind wichtig für die Gesundheit Ihres Kindes.
      text: >-
        Der Eltern-Kind-Pass sieht ärztliche Untersuchungen bis zum 5. Lebensjahr vor, in den ersten 14 Lebensmonaten
        fünf. Welche als Nächstes fällig ist, steht im Pass.
    - id: find
      type: book
      title: Kinderärztin oder Kinderarzt finden
      done_label: Erledigt
      why: Die Untersuchungen machen Ärztinnen und Ärzte, meist in der Kinderheilkunde.
      institution: responsible
      after: [info]
      text: In der Vertragspartnersuche der ÖGK finden Sie Ordinationen in Ihrer Nähe.

- id: family_allowance
  title: Familienbeihilfe
  summary: Geld für Eltern für ihre Kinder, unabhängig von Beschäftigung und Einkommen.
  priority: 14
  triggers:
    - {goal: [child_offers], subject: [child]}
  requires: [subject]
  responsible:
    - {institution: tax_office}
  checked_by:
    - Bei der Geburt muss sie nicht mehr beantragt werden; die Finanzverwaltung prüft und überweist automatisch. Grundsätzlich gibt es sie bis zum 24. Geburtstag des Kindes.
  source_url: https://www.oesterreich.gv.at/de/themen/familie_und_partnerschaft/familienbeihilfe/Seite.450233
  verified_at: 2026-11-05
  steps:
    - id: info
      type: info
      title: Bekommen Sie schon Familienbeihilfe?
      why: Meist kommt sie automatisch, aber nicht in jedem Fall.
      text: >-
        Nach der Geburt prüft die Finanzverwaltung alles automatisch und überweist die Familienbeihilfe. Fehlt etwas,
        etwa die Bankverbindung, fragt sie nach. Kommt nichts, gibt es einen Antrag.
    - id: form
      type: form
      title: Nur falls nötig - Antrag stellen
      why: Für Fälle, in denen die Familienbeihilfe nicht automatisch kommt.
      institution: responsible
      form: family_allowance_form
      after: [info]
      text: Füllen Sie das Formular aus und reichen Sie es beim Finanzamt ein.

