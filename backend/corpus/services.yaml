# Services (Leistungen) with triggers, criteria and step templates. See docs/response-system.md, section 5.
#
# Conditions map fact keys to matchers: a list of values (the fact is, or contains, one of them)
# or {not: [values]}. All keys of a condition must match. A service is a candidate if any trigger matches.
# Scripts use placeholders only; contact data always comes from institutions.yaml.

- id: care_allowance
  title: Pflegegeld
  summary: Monatliches Geld für Menschen, die ständig Betreuung und Pflege brauchen. Die Höhe hängt vom Pflegebedarf ab, nicht vom Einkommen.
  priority: 1
  triggers:
    - {goal: [apply_care_allowance]}
    - {needs_daily_help: [some, a_lot]}
  requires: [subject, district, pension_payer]
  responsible:
    - {when: {pension_payer: [bvaeb]}, institution: bvaeb}
    - {when: {pension_payer: [svs]}, institution: svs}
    - {institution: pva_vienna}
  responsible_note: Zuständig ist die Stelle, die die Pension auszahlt. Wer keine Pension bezieht, stellt den Antrag bei der Pensionsversicherung.
  responsible_source: https://www.oesterreich.gv.at/de/themen/pflege/4/Seite.360515
  criteria:
    - id: residence
      text: Gewöhnlicher Aufenthalt in Österreich
      when: {district: {not: [outside_vienna]}}
  checked_by:
    - Ob der Pflegebedarf mehr als 65 Stunden im Monat beträgt und voraussichtlich mindestens 6 Monate dauert, wird bei einer Begutachtung festgestellt.
  documents: [medical_reports]
  forms: [care_allowance_form]
  source_url: https://www.pv.at/web/pflegegeld
  verified_at: 2026-11-05
  steps:
    - id: info
      type: info
      title: Was ist Pflegegeld?
      why: Damit Sie wissen, worum es beim Antrag geht.
      text: >-
        Monatliches Geld für Menschen, die ständig Pflege brauchen. Es deckt einen Teil der Mehrkosten. Es gibt 7
        Stufen; die Höhe hängt vom Pflegebedarf ab, nicht vom Einkommen. Den Antrag dürfen auch Familienmitglieder,
        Haushaltsmitglieder und nahestehende Personen stellen.

    - id: call
      type: call
      title: Bei der zuständigen Stelle anrufen
      why: Dort bekommen Sie den Antrag und Antworten auf Ihre Fragen.
      institution: responsible
      channel: phone
      script_facts: [subject, pension_payer]
      have_ready: [subject.svnr]
      slots: [user.name, user.phone, subject.relation, subject.name, subject.svnr]
      must_ask:
        - {id: get_form, text: "Den Antrag auf Pflegegeld anfordern oder fragen, ob er online gestellt werden kann"}
        - {id: relative_applies, text: "Fragen, ob die anrufende Person den Antrag als Angehörige oder Angehöriger für die betroffene Person stellen kann", when: {subject: {not: [self]}}}
        - {id: assessment, text: "Fragen, wie die Begutachtung abläuft und ob eine Vertrauensperson dabei sein kann"}
        - {id: consultation, text: "Fragen, ob es Hilfe beim Ausfüllen oder einen Beratungstermin gibt"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}. Ich rufe wegen eines Antrags auf Pflegegeld für {subject.relation} an.
        points:
          - {covers: get_form, text: "Können Sie mir das Antragsformular zuschicken, oder kann ich den Antrag auch online stellen?"}
          - {covers: relative_applies, text: "Kann ich den Antrag als Angehörige oder Angehöriger stellen, und was muss ich dafür beilegen?"}
          - {covers: assessment, text: "Wie läuft die Begutachtung ab, und kann eine Vertrauensperson dabei sein?"}
          - {covers: consultation, text: "Gibt es Hilfe beim Ausfüllen, zum Beispiel einen Beratungstermin?"}
        closing: Vielen Dank. Darf ich mir Ihren Namen notieren? Für Rückfragen erreichen Sie mich unter {user.phone}.

    - id: documents
      type: documents
      title: Unterlagen sammeln
      why: Diese Unterlagen werden für die Anträge gebraucht.

    - id: submit
      type: form
      title: Antrag ausfüllen und einreichen
      why: Erst mit dem Antrag kann über das Pflegegeld entschieden werden.
      institution: responsible
      form: care_allowance_form
      after: [call, documents]
      text: >-
        Legen Sie vorhandene Befunde in Kopie bei. Unter Punkt 9 können Sie eine kostenlose Pflegeberatung zu Hause
        durch eine diplomierte Pflegefachkraft ankreuzen. Auch ein anderer Sozialversicherungsträger nimmt den Antrag
        an und leitet ihn weiter.

    - id: assessment
      type: wait
      title: Begutachtung zu Hause
      why: Bei der Begutachtung wird die Pflegestufe festgestellt.
      after: [submit]
      done_label: Begutachtung war
      text: >-
        Der Hausbesuch wird vorher angekündigt. Eine Vertrauensperson, etwa eine Angehörige oder ein Angehöriger, kann
        dabei sein und beschreiben, welche Hilfe im Alltag nötig ist.

    - id: decision
      type: wait
      title: Auf die Entscheidung warten
      why: Danach wissen Sie, ob und in welcher Stufe Pflegegeld ausgezahlt wird.
      after: [assessment]
      outcomes:
        - {id: granted, label: Pflegegeld bewilligt, effect: done}
        - {id: rejected, label: Abgelehnt, effect: done}
      text: >-
        Pflegegeld gebührt ab dem Monatsersten nach dem Antrag und wird monatlich im Nachhinein ausgezahlt.
        Wird der Pflegeaufwand später größer, kann eine Erhöhung schriftlich beantragt werden.

    - id: clarify
      type: call
      title: Die Entscheidung mit der zuständigen Stelle besprechen
      why: Dort erfahren Sie, warum abgelehnt wurde und welche Möglichkeiten es gibt.
      institution: responsible
      channel: phone
      after: [decision]
      unlocked_by: "decision:rejected"
      script_facts: [subject]
      have_ready: [subject.svnr]
      slots: [user.name, user.phone, subject.relation, subject.name, subject.svnr]
      must_ask:
        - {id: reason, text: "Fragen, warum der Antrag auf Pflegegeld abgelehnt wurde"}
        - {id: options, text: "Fragen, welche Möglichkeiten es jetzt gibt und bis wann"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}. Ich rufe wegen der Entscheidung über das Pflegegeld für {subject.relation} an.
        points:
          - {covers: reason, text: "Warum wurde der Antrag abgelehnt?"}
          - {covers: options, text: "Welche Möglichkeiten gibt es jetzt, und bis wann muss ich etwas tun?"}
        closing: Vielen Dank. Darf ich mir Ihren Namen notieren? Für Rückfragen erreichen Sie mich unter {user.phone}.

- id: home_care_fsw
  title: Pflege und Betreuung zu Hause (FSW)
  summary: Der Fonds Soziales Wien berät zu Heimhilfe, Hauskrankenpflege, Essen auf Rädern und Begleitdiensten und vermittelt geförderte Angebote.
  priority: 2
  triggers:
    - {goal: [find_support_services]}
    - {needs_daily_help: [some, a_lot]}
    - {documented_recommendations: [home_nursing, home_help]}
  quotes: [home_nursing, home_help]
  requires: [subject, district, lives_alone]
  responsible:
    - {institution: fsw_customer_service}
  criteria:
    - id: vienna
      text: Wohnort in Wien
      when: {district: {not: [outside_vienna]}}
  checked_by:
    - Den individuellen Bedarf stellt das FSW-Kund:innenservice fest.
    - Der Kostenbeitrag hängt unter anderem von Einkommen, Miet- und Wohnkosten und Pflegegeld ab.
  documents: [photo_id, citizenship_proof, income_proof, rent_proof, care_expenses_proof]
  forms: [fsw_application_form]
  source_url: https://www.fsw.at/p/pflege-betreuung-daheim
  verified_at: 2026-11-05
  steps:
    - id: call
      type: call
      title: Beim FSW-Kund:innenservice anrufen
      why: Der FSW berät, welche Unterstützung zu Hause passt, und vermittelt eine Partnerorganisation.
      institution: responsible
      channel: phone
      script_facts: [subject, lives_alone, needs_daily_help]
      slots: [user.name, user.phone, subject.relation]
      must_ask:
        - {id: home_help, text: "Nach Heimhilfe fragen, z. B. bei Körperpflege, Haushalt und kleinen Einkäufen"}
        - {id: meals, text: "Nach Essen auf Rädern fragen"}
        - {id: escort, text: "Nach einem Begleitdienst für Wege und Besorgungen fragen"}
        - {id: assessment, text: "Fragen, wie der Bedarf festgestellt wird und wie der Antrag gestellt wird"}
        - {id: costs, text: "Fragen, wovon der Kostenbeitrag abhängt"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}. Ich rufe an, weil ich Unterstützung zu Hause für {subject.relation} suche.
        points:
          - {covers: home_help, text: "Welche Hilfe zu Hause gibt es, zum Beispiel Heimhilfe bei Körperpflege, Haushalt und Einkäufen?"}
          - {covers: meals, text: "Ist Essen auf Rädern möglich?"}
          - {covers: escort, text: "Gibt es eine Begleitung für Wege und Besorgungen?"}
          - {covers: assessment, text: "Wie wird der Bedarf festgestellt, und wie stelle ich den Antrag?"}
          - {covers: costs, text: "Wovon hängt der Kostenbeitrag ab?"}
        closing: Vielen Dank. Für Rückfragen erreichen Sie mich unter {user.phone}.

    - id: documents
      type: documents
      title: Unterlagen sammeln
      why: Diese Unterlagen werden für die Anträge gebraucht.

    - id: send_application
      type: email
      title: FSW-Antrag per E-Mail schicken
      why: Mit dem Antrag kann der FSW die Unterstützung fördern.
      institution: responsible
      channel: applications_email
      form: fsw_application_form
      after: [call, documents]
      script_facts: [subject]
      slots: [user.name, user.phone, user.email, user.address, subject.relation]
      must_include:
        - {id: application, text: "Sagen, dass der ausgefüllte und unterschriebene Antrag auf Förderung von Leistungen (Pflege und Betreuung zu Hause) angehängt ist"}
        - {id: attachments, text: "Sagen, dass die nötigen Beilagen angehängt sind"}
        - {id: contact, text: "Telefonnummer oder E-Mail-Adresse für Rückfragen nennen"}
      fallback_script:
        subject: Antrag auf Förderung von Leistungen – Pflege und Betreuung zu Hause
        body: |-
          Sehr geehrte Damen und Herren,

          im Anhang sende ich den ausgefüllten und unterschriebenen Antrag auf Förderung von Leistungen (Pflege und Betreuung zu Hause) für {subject.relation}.

          Die nötigen Beilagen habe ich ebenfalls angehängt.

          Für Rückfragen erreichen Sie mich unter {user.phone} oder {user.email}.

          Mit freundlichen Grüßen
          {user.name}
          {user.address}
        covers: [application, attachments, contact]

    - id: assessment
      type: wait
      title: Bedarf wird festgestellt
      why: Danach wissen Sie, welche Unterstützung gefördert wird.
      after: [send_application]
      done_label: Rückmeldung erhalten
      text: >-
        Das FSW-Kund:innenservice stellt den individuellen Bedarf fest, berät und vermittelt eine passende Partnerorganisation.

- id: carer_support
  title: Entlastung für pflegende Angehörige
  summary: Kostenlose Gespräche mit Psychologinnen und Psychologen für Angehörige, die jemanden pflegen, und Hausbesuche durch Pflegefachkräfte.
  priority: 3
  triggers:
    - {subject: [mother, father, partner, child, other_relative], needs_daily_help: [some, a_lot]}
  requires: [subject, district]
  responsible:
    - {institution: carer_competence_centre}
  checked_by:
    - Hausbesuche durch Pflegefachkräfte gibt es für Menschen, die Pflegegeld beziehen, und ihre Angehörigen.
  source_url: https://www.sozialministerium.gv.at/Themen/Pflege/Betreuende-und-Pflegende-Angehoerige.html
  verified_at: 2026-11-05
  steps:
    - id: info
      type: info
      title: Was ist das Angehörigengespräch?
      why: Pflege kann sehr belasten. Dieses Angebot ist für Sie selbst.
      text: >-
        Kostenlose Gespräche mit Psychologinnen und Psychologen: zu Hause, an einem anderen Ort, telefonisch oder
        online, bis zu zehn Termine. Wer Pflegegeld bezieht, kann zusätzlich einen kostenlosen Hausbesuch einer
        diplomierten Pflegefachkraft anfordern: Pflegetipps, Hilfsmittel, soziale Dienste.

    - id: request_talk
      type: email
      title: Angehörigengespräch anfragen
      why: Das Gespräch wird auf Wunsch vereinbart.
      institution: responsible
      channel: carer_talk_email
      script_facts: [subject]
      slots: [user.name, user.phone, user.email, subject.relation]
      must_include:
        - {id: request, text: "Um ein kostenloses Angehörigengespräch bitten"}
        - {id: situation, text: "Kurz sagen, wen die Person zu Hause betreut"}
        - {id: contact, text: "Telefonnummer oder E-Mail-Adresse für die Terminvereinbarung nennen"}
      fallback_script:
        subject: Anfrage Angehörigengespräch
        body: |-
          Sehr geehrte Damen und Herren,

          ich betreue {subject.relation} zu Hause und möchte um ein kostenloses Angehörigengespräch bitten.

          Für einen Termin erreichen Sie mich unter {user.phone} oder {user.email}.

          Mit freundlichen Grüßen
          {user.name}
        covers: [request, situation, contact]


# Still in hospital: there is no letter yet, and only the hospital knows the discharge date.
- id: before_discharge
  title: Entlassung aus dem Spital vorbereiten
  summary: Den Entlassungstermin kennt nur das Spital. Fragen Sie auf der Station nach, und klären Sie gleich, was danach zu organisieren ist.
  priority: 2
  triggers:
    - {hospital_topic: [discharge]}
  requires: [subject]
  responsible: []
  source_url: https://www.gesundheit.gv.at/gesundheitsleistungen/krankenhausaufenthalt/entlassungstag-krankenhaus.html
  verified_at: 2026-11-05
  steps:
    - id: call
      type: call
      title: Auf der Station nach dem Entlassungstermin fragen
      why: Den Termin bespricht die behandelnde Ärztin oder der behandelnde Arzt im Spital.
      contact_label: Die Station im Spital
      script_facts: [subject]
      have_ready: [subject.name]
      slots: [user.name, user.phone, subject.relation, subject.name]
      must_ask:
        - {id: date, text: "Fragen, wann die Entlassung voraussichtlich geplant ist"}
        - {id: management, text: "Fragen, wer im Spital beim Entlassungsmanagement die Zeit nach der Entlassung mit organisiert"}
        - {id: letter, text: "Fragen, ob der Entlassungsbrief am Entlassungstag mitgegeben wird"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}. Es geht um die Entlassung von {subject.name}.
        points:
          - {covers: date, text: "Wann ist die Entlassung voraussichtlich geplant?"}
          - {covers: management, text: "Wer vom Entlassungsmanagement organisiert mit uns die Zeit nach der Entlassung?"}
          - {covers: letter, text: "Wird der Entlassungsbrief am Entlassungstag mitgegeben?"}
        closing: Vielen Dank. Für Rückfragen erreichen Sie mich unter {user.phone}.
    - id: upload
      type: upload
      title: Später den Entlassungsbrief hochladen
      why: Den Brief gibt es am Entlassungstag. Darin steht, was nach dem Spital empfohlen wird.
      after: [call]
      text: >-
        Der Lotse sucht nur Empfehlungen zu Anträgen und Unterstützung, keine Befunde, und zeigt Ihnen jede Stelle
        wörtlich. Der Brief wird nicht gespeichert.

# Hours differ by hospital and even by ward, so the plan never states them: the script asks the ward.
- id: hospital_visit
  title: Besuch im Spital
  summary: Besuchszeiten und Regeln sind je nach Spital und Station verschieden. Fragen Sie vor dem Besuch auf der Station nach.
  priority: 3
  triggers:
    - {hospital_topic: [visit]}
  requires: [subject]
  responsible: []
  source_url: https://klinik-ottakring.gesundheitsverbund.at/besuchszeiten/
  verified_at: 2026-11-05
  steps:
    - id: call
      type: call
      title: Auf der Station nach dem Besuch fragen
      why: Manche Stationen haben eigene Besuchszeiten, oder Sie müssen sich vorher anmelden.
      contact_label: Die Station im Spital
      script_facts: [subject]
      have_ready: [subject.name]
      slots: [user.name, user.phone, subject.relation, subject.name]
      must_ask:
        - {id: hours, text: "Fragen, wann auf dieser Station Besuchszeit ist"}
        - {id: register, text: "Fragen, ob der Besuch vorher angemeldet werden muss"}
        - {id: visitors, text: "Fragen, wie viele Personen kommen dürfen und ob Kinder mitkommen dürfen"}
        - {id: where, text: "Fragen, wo die Station und das Zimmer zu finden sind"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}. Ich möchte {subject.name} besuchen.
        points:
          - {covers: hours, text: "Wann ist auf Ihrer Station Besuchszeit?"}
          - {covers: register, text: "Muss ich den Besuch vorher anmelden?"}
          - {covers: visitors, text: "Wie viele Personen dürfen kommen, und dürfen Kinder mitkommen?"}
          - {covers: where, text: "Wo finde ich die Station und das Zimmer?"}
        closing: Vielen Dank. Für Rückfragen erreichen Sie mich unter {user.phone}.


# Phase 2: after a hospital stay (spec 12.3). The letter's confirmed recommendations trigger the services below.
- id: after_hospital
  title: Nach dem Spital
  summary: Der Lotse liest die Empfehlungen aus Ihrem Entlassungsbrief und macht daraus Ihre nächsten Schritte.
  priority: 2
  triggers:
    - {goal: [after_hospital]}
  requires: [subject]
  responsible: []
  source_url: https://www.pv.at/web/reha-und-praevention/vom-antrag-zu-reha-und-kur
  verified_at: 2026-11-05
  steps:
    - id: upload
      type: upload
      title: Entlassungsbrief hochladen
      why: Im Brief steht, was nach dem Spital empfohlen wird, zum Beispiel Reha oder Pflege zu Hause.
      text: >-
        Der Lotse sucht nur Empfehlungen zu Anträgen und Unterstützung, keine Befunde, und zeigt Ihnen jede Stelle
        wörtlich. Der Brief wird nicht gespeichert.
- id: rehab
  title: Medizinische Rehabilitation
  summary: Ein Reha-Aufenthalt, stationär oder ambulant. Die Ärztin oder der Arzt füllt den Antrag aus, die Pensionsversicherung entscheidet.
  priority: 4
  triggers:
    - {documented_recommendations: [inpatient_rehab, outpatient_rehab]}
  quotes: [inpatient_rehab, outpatient_rehab]
  requires: [subject, district]
  responsible:
    - {institution: pva_vienna}
  responsible_note: Den Antrag schicken Sie an die zuständige Landesstelle der Pensionsversicherung; die Zuständigkeit richtet sich nach dem Wohnort.
  responsible_source: https://www.pv.at/web/reha-und-praevention/vom-antrag-zu-reha-und-kur
  checked_by:
    - Die medizinische Notwendigkeit begründet die behandelnde Ärztin oder der behandelnde Arzt. Über die Bewilligung entscheidet die Pensionsversicherung.
  forms: [rehab_form]
  source_url: https://www.pv.at/web/reha-und-praevention/vom-antrag-zu-reha-und-kur
  verified_at: 2026-11-05
  steps:
    - id: info
      type: info
      title: Reha laut Ihrem Brief
      why: Damit Sie wissen, wie der Weg zur Reha aussieht.
      text: >-
        Den Reha-Antrag füllt Ihre Ärztin oder Ihr Arzt aus, unterschreibt und begründet ihn medizinisch. Ob stationär
        oder ambulant besser passt, besprechen Sie mit ihr oder ihm.
    - id: call_doctor
      type: call
      title: Ärztin oder Arzt um den Reha-Antrag bitten
      why: Ohne ärztlich ausgefüllten Antrag gibt es keine Reha.
      contact_label: Ihre behandelnde Ärztin oder Ihr behandelnder Arzt
      after: [info]
      script_facts: [subject]
      have_ready: [subject.svnr]
      slots: [user.name, user.phone, subject.relation, subject.name, subject.svnr]
      must_ask:
        - {id: appointment, text: "Um einen Termin bitten, um den Reha-Antrag auszufüllen"}
        - {id: form, text: "Fragen, ob der Antrag in der Ordination ausgefüllt und unterschrieben werden kann"}
        - {id: inpatient_or_outpatient, text: "Fragen, ob eine stationäre oder ambulante Reha besser passt"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}. Ich rufe wegen eines Antrags auf Rehabilitation für {subject.relation} an.
        points:
          - {covers: appointment, text: "Kann ich einen Termin bekommen, um den Reha-Antrag auszufüllen?"}
          - {covers: form, text: "Können Sie den Antrag ausfüllen und unterschreiben?"}
          - {covers: inpatient_or_outpatient, text: "Passt eine stationäre oder eine ambulante Reha besser?"}
        closing: Vielen Dank. Für Rückfragen erreichen Sie mich unter {user.phone}.
    - id: submit
      type: form
      title: Reha-Antrag einreichen
      why: Erst mit dem Antrag kann die Pensionsversicherung entscheiden.
      institution: responsible
      form: rehab_form
      after: [call_doctor]
      text: >-
        Senden Sie den ausgefüllten Antrag an die zuständige Landesstelle der Pensionsversicherung. Für eine ambulante Reha
        muss im Antrag das Feld „ambulante Rehabilitation“ angekreuzt sein.
    - id: decision
      type: wait
      title: Auf die Entscheidung warten
      why: Danach wissen Sie, ob und wo die Reha stattfindet.
      after: [submit]
      outcomes:
        - {id: approved, label: Reha bewilligt, effect: done}
        - {id: rejected, label: Abgelehnt, effect: done}
      text: >-
        Die Pensionsversicherung teilt die Entscheidung schriftlich mit. Warten Sie diese schriftliche Verständigung ab.
    - id: rejected
      type: info
      title: Wenn die Reha abgelehnt wurde
      why: Eine Ablehnung muss nicht endgültig sein.
      after: [decision]
      unlocked_by: "decision:rejected"
      text: >-
        Eine Ablehnung kann formelle oder medizinische Gründe haben. Ändert sich der Gesundheitszustand wesentlich,
        ist ein neuer Antrag möglich. Besprechen Sie das mit Ihrer Ärztin oder Ihrem Arzt.

- id: transport_cost_subsidy
  title: Zuschuss zu Fahrtkosten
  summary: Die ÖGK gibt einen Zuschuss zu Fahrten, etwa zu Strahlen- oder Chemotherapie, zur Dialyse oder zur Reha.
  priority: 5
  triggers:
    - {documented_recommendations: [transport_to_treatment]}
  quotes: [transport_to_treatment]
  requires: [subject, district]
  responsible:
    - {institution: oegk_vienna_customer_service}
  checked_by:
    - Grundsätzlich für Personen mit Rezeptgebührenbefreiung. Für Fahrten zu Dialyse, Chemo- oder Strahlentherapie und für ausgewählte Fahrten zur Reha gilt das nicht. Ersetzt werden Fahrten zum nächstgelegenen geeigneten Vertragspartner, wenn er mehr als 20 Kilometer entfernt ist.
  forms: [transport_cost_form]
  source_url: https://www.oegk.at/cdscontent/load?contentid=10008.777900&version=1785415038
  verified_at: 2026-11-05
  steps:
    - id: collect
      type: info
      title: Behandlungen bestätigen lassen
      why: Der Antrag braucht für jede Fahrt eine Bestätigung der Einrichtung.
      text: >-
        Lassen Sie nach jeder Behandlung ein Feld am Antrag abstempeln. Am Ende reichen Sie den Antrag für alle
        Sitzungen auf einmal ein, mit Kopien der Fahrtkosten-Belege.
    - id: submit
      type: form
      title: Fahrtkosten-Zuschuss beantragen
      why: Der Zuschuss wird nur auf Antrag überwiesen.
      institution: responsible
      form: transport_cost_form
      after: [collect]
      text: Füllen Sie den Antrag aus und reichen Sie ihn bei der ÖGK ein.

- id: home_nursing_medical
  title: Medizinische Hauskrankenpflege
  summary: Pflege zu Hause, die einen Spitalsaufenthalt ersetzt. Sie wird ärztlich angeordnet und von der Krankenkasse übernommen.
  priority: 6
  triggers:
    - {documented_recommendations: [home_nursing]}
  quotes: [home_nursing]
  requires: [subject, district]
  responsible:
    - {institution: oegk_vienna_customer_service}
  checked_by:
    - Die Krankenkasse übernimmt sie nur, wenn sie die Pflege im Spital ersetzt. Sie gilt längstens vier Wochen; eine Verlängerung braucht eine chef- oder kontrollärztliche Bewilligung.
  source_url: https://www.oegk.at/cdscontent/load?contentid=10008.734180&version=1585216930
  verified_at: 2026-11-05
  steps:
    - id: info
      type: info
      title: Was ist medizinische Hauskrankenpflege?
      why: Damit Sie wissen, wer sie anordnet und wie lange sie gilt.
      text: >-
        Die Ärztin oder der Arzt ordnet sie an, für längstens vier Wochen. Eine Verlängerung muss spätestens am 24.
        Tag beantragt werden. Für Heimhilfe oder Essen auf Rädern ist der FSW zuständig.

- id: medical_aids
  title: Heilbehelfe und Hilfsmittel
  summary: Die ÖGK übernimmt die Kosten für Heilbehelfe und Hilfsmittel, wenn sie ärztlich verordnet sind. Meist bleibt ein Selbstbehalt.
  priority: 7
  triggers:
    - {documented_recommendations: [medical_aid]}
  quotes: [medical_aid]
  requires: [subject, district]
  responsible:
    - {institution: oegk_vienna_customer_service}
  source_url: https://www.oegk.at/cdscontent/?contentid=10007.870456&portal=oegkportal
  verified_at: 2026-11-05
  steps:
    - id: call_doctor
      type: call
      title: Verordnung bei der Ärztin oder beim Arzt holen
      why: Ohne ärztliche Verordnung übernimmt die ÖGK die Kosten nicht.
      contact_label: Ihre Hausärztin oder Ihr Hausarzt
      script_facts: [subject]
      slots: [user.name, user.phone, subject.relation]
      must_ask:
        - {id: prescription, text: "Um eine Verordnung für das empfohlene Hilfsmittel bitten"}
        - {id: supplier, text: "Fragen, wo es das Hilfsmittel gibt"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}. Ich rufe wegen eines Hilfsmittels für {subject.relation} an.
        points:
          - {covers: prescription, text: "Können Sie eine Verordnung für das empfohlene Hilfsmittel ausstellen?"}
          - {covers: supplier, text: "Wo bekomme ich das Hilfsmittel?"}
        closing: Vielen Dank. Für Rückfragen erreichen Sie mich unter {user.phone}.

