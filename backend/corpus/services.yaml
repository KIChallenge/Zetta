- id: minimum_income
  title: Wiener Mindestsicherung
  summary: Hilfe für Menschen ohne oder mit geringem Einkommen, mit Geld und Beratung durch Sozialarbeiterinnen und Sozialarbeiter.
  priority: 17
  triggers:
    - {goal: [financial_help]}
  requires: [subject, district]
  responsible:
    - {institution: ma40_service}
  criteria:
    - id: vienna
      text: Wohnort in Wien
      when: {district: {not: [outside_vienna]}}
  checked_by:
    - Die Voraussetzungen werden immer im Einzelfall geprüft.
  documents: [photo_id, income_proof, rent_proof, assets_proof, account_holder_proof]
  forms: [minimum_income_form]
  source_url: https://www.wien.gv.at/amtswege/mindestsicherung-antrag
  verified_at: 2026-11-05
  steps:
    - id: call
      type: call
      title: Telefonische Erstberatung
      why: Dort klären Sie, welche Unterstützung passt, auch bei Energiekosten.
      institution: responsible
      script_facts: [subject]
      slots: [user.name, user.phone]
      must_ask:
        - {id: minimum_income, text: "Fragen, ob Mindestsicherung in Frage kommt und wie der Antrag geht"}
        - {id: other_help, text: "Nach Unterstützung bei Energiekosten oder in besonderen Lebenslagen fragen"}
        - {id: appointment, text: "Fragen, ob ein Beratungsgespräch vereinbart werden kann"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}. Ich habe kein oder nur ein geringes Einkommen und brauche Unterstützung.
        points:
          - {covers: minimum_income, text: "Kommt die Mindestsicherung für mich in Frage, und wie stelle ich den Antrag?"}
          - {covers: other_help, text: "Gibt es auch Unterstützung bei Energiekosten?"}
          - {covers: appointment, text: "Kann ich ein Beratungsgespräch vereinbaren?"}
        closing: Vielen Dank. Sie erreichen mich unter {user.phone}.
    - id: documents
      type: documents
      title: Unterlagen sammeln
      why: Alle Unterlagen müssen vollständig und in Kopie beiliegen, von allen im Haushalt.
    - id: submit
      type: form
      title: Antrag stellen
      why: Erst mit dem Antrag kann die Stadt Wien entscheiden.
      institution: responsible
      form: minimum_income_form
      after: [call, documents]
      text: Den Antrag können Sie online mit einem Stadt Wien Konto stellen. Hilfe beim Online-Antrag gibt das Sozialzentrum Ihres Wohnbezirks.

