# Phase 3: Gesundheitsförderung (12.2), Kind (12.4), Arzttermin (12.5), soziale Hilfe (area E).
- id: health_check
  title: Gesundheits-Check (Vorsorgeuntersuchung)
  summary: Einmal im Jahr kostenlos für alle ab 18, die in Österreich leben. Bei Ärztinnen und Ärzten mit Vorsorgeuntersuchungs-Vertrag und in den Gesundheitszentren der ÖGK.
  priority: 10
  triggers:
    - {interests: [screening]}
  requires: [subject_age_band]
  responsible:
    - {institution: oegk_health_check}
  criteria:
    - id: adult
      text: Ab 18 Jahren
      when: {subject_age_band: {not: ["0-5", "6-14", "15-17"]}}
  checked_by:
    - Empfohlen wird sie unter 40 Jahren alle drei Jahre, ab 40 alle zwei Jahre. Möglich ist sie, wenn die letzte mindestens zwölf Monate her ist.
  source_url: https://www.oegk.at/cdscontent/?contentid=10007.912730&portal=oegkportal
  verified_at: 2026-11-05
  steps:
    - id: find
      type: book
      title: Ordination mit Vorsorgeuntersuchung finden
      done_label: Erledigt
      why: Die Untersuchung machen Ärztinnen und Ärzte mit Vorsorgeuntersuchungs-Vertrag.
      institution: responsible
      text: In der Vertragspartnersuche der ÖGK finden Sie Ordinationen in Ihrer Nähe. Meist ist die Hausärztin oder der Hausarzt die erste Anlaufstelle.
    - id: call
      type: call
      title: Termin für den Gesundheits-Check vereinbaren
      why: Mit einem Termin müssen Sie nicht lange warten.
      contact_label: Die Ordination, die Sie gefunden haben
      after: [find]
      script_facts: [subject, preferred_time]
      slots: [user.name, user.phone, subject.relation]
      must_ask:
        - {id: appointment, text: "Um einen Termin für den kostenlosen Gesundheits-Check (Vorsorgeuntersuchung) bitten"}
        - {id: time, text: "Die bevorzugte Tageszeit nennen, falls bekannt"}
        - {id: bring, text: "Fragen, was zum Termin mitzubringen ist"}
      fallback_script:
        opening: Guten Tag, mein Name ist {user.name}.
        points:
          - {covers: appointment, text: "Ich hätte gerne einen Termin für den kostenlosen Gesundheits-Check für {subject.relation}."}
          - {covers: time, text: "Gibt es einen Termin, der gut passt?"}
          - {covers: bring, text: "Was soll ich zum Termin mitbringen?"}
        closing: Vielen Dank. Für Rückfragen erreichen Sie mich unter {user.phone}.

- id: vaccination
  title: Impfungen
  summary: Die Impfstellen der Stadt Wien impfen nur mit Termin. Kinder bekommen die Impfungen des Kinder-Impfprogramms kostenlos.
  priority: 11
  triggers:
    - {interests: [vaccination]}
    - {goal: [child_offers], subject: [child]}
  requires: [subject, subject_age_band]
  responsible:
    - {institution: impfservice_wien}
  checked_by:
    - Gratis sind Impfungen für Kinder bis 6 Jahre und für Kinder und Jugendliche von 6 bis 15 Jahren; die HPV-Impfung ist für Personen zwischen 9 und 21 Jahren kostenlos.
  source_url: https://www.wien.gv.at/gesundheit/impfen
  verified_at: 2026-11-05
  steps:
    - id: book
      type: book
      title: Impftermin buchen
      done_label: Erledigt
      why: Ohne Termin wird in den Impfstellen der Stadt Wien nicht geimpft.
      institution: responsible
      channel: booking
      text: Buchen Sie online oder telefonisch unter der Gesundheitsberatung. Zum Termin den Impfpass mitnehmen, falls vorhanden.

