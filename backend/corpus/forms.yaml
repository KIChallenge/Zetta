      questions:
        - {id: practitioner, label: "Bei wem fand die Behandlung statt? (Name, Adresse)", pdf: Behandler/in, manual: true, page: 1}
        - {id: treatment, label: Art der Behandlung bzw. Reha-Maßnahme, pdf: Art der Behandlung, manual: true, page: 1}
        - {id: companion_reason, label: "Warum wurden Sie begleitet?", pdf: Grund, manual: true, page: 1}
        - {id: bank_account, label: "IBAN", pdf: IBAN, manual: true, page: 1}
        - {id: confirmation, label: "Von der Einrichtung/vom Behandler auszufüllen: Datum, Stempel und Unterschrift", manual: true, page: 1}
        - {id: signature, label: "Ort/Datum, Unterschrift", pdf: Ort/Datum, manual: true, page: 1}
  checks:
    - when: {}
      text: Lassen Sie jede Behandlung von der Einrichtung bestätigen, pro Fahrt ein Stempel.
    - when: {companion: ["yes"]}
      text: >-
        Kosten für Begleitpersonen werden ersetzt für Kinder unter 15 Jahren oder wenn die versicherte Person aufgrund
        ihres körperlichen oder geistigen Zustandes eine Begleitperson benötigt und dies ärztlich bestätigt wird.

