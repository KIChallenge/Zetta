      questions:
        - {id: name, label: Patient/in, pdf: Patient/in, value: "{subject.name}", required: true}
        - {id: svnr, label: Versicherungsnummer, pdf: Versicherungsnummer1, value: "{subject.svnr}", required: true}
        - {id: address, label: "Adresse (Straße, Postleitzahl, Ort)", pdf: Adresse, value: "{subject.address}", required: true}
        - {id: insured_name, label: Versicherte/r, pdf: Versicherte/r}
        - {id: insured_svnr, label: Versicherungsnummer, pdf: Versicherungsnummer2, when: {insured_name: {not: [empty]}}}

    - id: trip
