        - {id: costs, label: Tatsächliche Kosten, pdf: Tatsächliche Kosten, help: In Euro. Bitte legen Sie vorhandene Belege in Kopie bei.}
        - {id: companion, label: Begleitperson, kind: yes_no, pdf: Begleitperson, map: {"yes": /Auswahl1, "no": /Auswahl2}, required: true}

    - id: paper
