# Application forms. `file` is the blank PDF in corpus/forms. `fields` say which PDF field gets which of the user's
# details (src/backend/forms.py): {user.*} are the user's, {subject.*} the ones of the person the chat is about, from
# the profile and the details kept from form cards. `map` gives a checkbox or radio button its state for a choice.
# Never medical details, signatures, application dates, consents or choices the user has to make.

- id: care_allowance_form
  title: Antrag auf Pflegegeld (PAL 080)
  url: https://www.pv.at/cdscontent/load?contentid=10008.781956&version=1783516198
  online_url: https://www.sozialversicherung.gv.at/formgen/?contentid=10007.892452&portal=pvportal&LO=1&layout=withNav&svtcode=02
  file: PAL080_0125_Mpfl_052026.pdf
  fields:
    - {field: VSNR_1, value: "{subject.svnr}"}
    - {field: Fam.Name, value: "{subject.last_name}"}
    - {field: Vorname, value: "{subject.first_name}"}
    - {field: Titel, value: "{subject.title}"}
    - {field: Geburtsdatum, value: "{subject.birth_date}"}
    - {field: Geschlecht, value: "{subject.sex}"}
    - {field: Stabü, value: "{subject.citizenship}", map: {austria: /01, other: /02}}
    - field: Personenstand
      value: "{subject.marital_status}"
      map: {single: /01, married: /02, widowed: /03, divorced: /04, partnership: /05, former_partnership: /08}
    - {field: Adresse Straße, value: "{subject.street}"}
    - {field: "Hausnummer, Stiege, Tür", value: "{subject.house}"}
    - {field: PLZ, value: "{subject.postal_code}"}
    - {field: Ort, value: "{subject.city}"}
    - {field: Telefon, value: "{subject.phone}"}
    - {field: Email, value: "{subject.email}"}
    # Section 2: the person filling in the form for someone else. Whether they are a representative stays open.
    - {field: Familienname andere, value: "{user.last_name}", when: {subject: {not: [self]}}}
    - {field: Vorname andere Person, value: "{user.first_name}", when: {subject: {not: [self]}}}
    - {field: Titel2, value: "{user.title}", when: {subject: {not: [self]}}}
    - {field: Adresse Straße 1, value: "{user.street}", when: {subject: {not: [self]}}}
    - {field: "Hausnummer, Stiege, Tür2", value: "{user.house}", when: {subject: {not: [self]}}}
    - {field: PLZ 1, value: "{user.postal_code}", when: {subject: {not: [self]}}}
    - {field: Ort 1, value: "{user.city}", when: {subject: {not: [self]}}}
    - {field: Telefon 1, value: "{user.phone}", when: {subject: {not: [self]}}}
    - {field: Email2, value: "{user.email}", when: {subject: {not: [self]}}}
  submit_to: pva_vienna
  source_url: https://www.pv.at/web/pflegegeld
  verified_at: 2026-11-05

- id: fsw_application_form
  title: Antrag auf Förderung von Leistungen (FSW)
  url: https://www.fsw.at/downloads/foerderwesen_anerkennung/foerderansuchen/subjektfoerderung/fsw-antrag-auf-foerderung-von-leistungen.pdf
  online_url: https://mein.fsw.at
  file: fsw-antrag-auf-foerderung-von-leistungen.1779095804.pdf
  fields:
    # The service this form is used for in services.yaml (home_care_fsw).
    - {field: Leistungen Pflege und Betreuung, value: /Ja}
    - {field: Pflege und Betreuung zu Hause, value: /Ja}
    - {field: Familienname Titel KundIn, value: "{subject.last_name}"}
    - {field: Vorname KundIn, value: "{subject.first_name}"}
    - {field: Geburtsdatum KundIn, value: "{subject.birth_date}"}
    - {field: Geschlecht KundIn, value: "{subject.sex}", map: {female: /weiblich, male: /maennlich, diverse: /divers/inter/offen}}
    - {field: "Familienstand ", value: "{subject.marital_status}"}
    - {field: Telefonnummer KundIn, value: "{subject.phone}"}
    - {field: E-Mail Adresse KundIn, value: "{subject.email}"}
    - {field: Strassennamen Lebensmittelpunkt, value: "{subject.street}"}
    - {field: Hausnr Lebensmittelpunkt, value: "{subject.house}"}
    - {field: PLZ Lebensmittelpunkt, value: "{subject.postal_code}"}
    - {field: Ort Lebensmittelpunkt, value: "{subject.city}"}
  submit_to: fsw_customer_service
  source_url: https://www.fsw.at/antrag
  verified_at: 2026-11-05

- id: rehab_form
  title: Antrag auf Rehabilitations-, Kur- bzw. Erholungsaufenthalt
  url: https://www.sozialversicherung.at/cdscontent/load?contentid=10008.555945&version=1767088043
  file: Antrag Kur und Reha.pdf
  fields:
    # The patient's rows only: who the insured person is and page 2 (the doctor's part) stay open.
    - {field: Patient(in), value: "{subject.last_name} {subject.first_name}"}
    - {field: VSNR_1, value: "{subject.svnr}"}
    - {field: Anschrift Patient(in), value: "{subject.address}"}
    - {field: Telefonnummer, value: "{subject.phone}"}
    - {field: Personenstand, value: "{subject.marital_status}"}
    - {field: zuständiger SV-träger, value: "{subject.health_insurer}"}
    - {field: Familienname, value: "{subject.last_name}"}
    - {field: Vorname, value: "{subject.first_name}"}
    - {field: Geburtsjahr, value: "{subject.birth_year}"}
    - {field: Geschlecht, value: "{subject.sex}", map: {female: /w, male: /m}}
  submit_to: pva_vienna
  source_url: https://www.pv.at/web/reha-und-praevention/vom-antrag-zu-reha-und-kur
  verified_at: 2026-11-05

