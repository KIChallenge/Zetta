services:
  backend:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/.venv
    command: uv run uvicorn backend.app:app --host 0.0.0.0
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
